name: 개발·검토용 미리보기 배포

# GitHub Pages 는 콘텐츠 검토용 미리보기입니다. 최종 운영 환경이 아닙니다.
# 시민에게 배포할 QR을 이 주소로 만들지 마세요.

# GitHub Pages 는 main 에서만 배포합니다.
# 작업 브랜치별 미리보기는 Vercel·Netlify 를 쓰세요 (vercel.json / netlify.toml).
# 여러 브랜치가 동시에 Pages 에 배포하면 concurrency 그룹에서 서로 취소되어
# 어느 브랜치 내용이 올라가 있는지 알 수 없게 됩니다.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: 빌드 및 검증
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 타입 검사
        run: npm run typecheck

      - name: 단위 테스트
        run: npm test

      - name: 개발·검토용 빌드
        run: npm run build:preview

      - name: 공식 배포본 빌드 및 자동검증
        run: npm run build:official

      - name: 전달용 ZIP 생성
        run: node scripts/package-official.mjs

      - name: 전달용 ZIP 아티팩트 업로드
        uses: actions/upload-artifact@v7
        with:
          name: chungju-minwon-guide-official
          path: release/chungju-minwon-guide.zip
          retention-days: 30

      - name: Pages 아티팩트 업로드
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist-preview

  deploy:
    name: GitHub Pages 배포 (검토용)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

name: 검증

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: 타입·테스트·빌드
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 타입 검사
        run: npm run typecheck

      - name: 단위 테스트
        run: npm test

      - name: 개발·검토용 빌드
        run: npm run build:preview

      - name: 공식 배포본 빌드 및 자동검증
        run: npm run build:official

      - name: 브라우저 설치
        run: npx playwright install --with-deps chromium

      - name: E2E · 접근성 테스트
        run: npm run test:e2e

      - name: 실패 시 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            test-results
            playwright-report
          retention-days: 7
